<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="45" fill="#16c07c" opacity="0.1"/>
  
  <!-- 小强轮廓 -->
  <path d="M30,40 Q40,30 50,30 Q60,30 70,40 Q75,45 75,55 Q75,65 70,70 Q65,75 60,75 Q55,80 50,80 Q45,80 40,75 Q35,75 30,70 Q25,65 25,55 Q25,45 30,40" 
        fill="#16c07c" stroke="#0c8c56" stroke-width="2"/>
  
  <!-- 触角 -->
  <path d="M40,30 Q35,25 30,25" stroke="#0c8c56" stroke-width="2" fill="none"/>
  <path d="M60,30 Q65,25 70,25" stroke="#0c8c56" stroke-width="2" fill="none"/>
  
  <!-- 眼睛 -->
  <circle cx="40" cy="45" r="3" fill="#0c8c56"/>
  <circle cx="60" cy="45" r="3" fill="#0c8c56"/>
  
  <!-- 身体纹路 -->
  <path d="M35,50 L65,50" stroke="#0c8c56" stroke-width="1" opacity="0.5"/>
  <path d="M35,60 L65,60" stroke="#0c8c56" stroke-width="1" opacity="0.5"/>
  
  <!-- 腿 -->
  <path d="M30,55 Q25,50 20,50" stroke="#0c8c56" stroke-width="2" fill="none"/>
  <path d="M30,65 Q25,70 20,70" stroke="#0c8c56" stroke-width="2" fill="none"/>
  <path d="M70,55 Q75,50 80,50" stroke="#0c8c56" stroke-width="2" fill="none"/>
  <path d="M70,65 Q75,70 80,70" stroke="#0c8c56" stroke-width="2" fill="none"/>
  
  <!-- 文字：小强 -->
  <text x="50" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#16c07c" font-weight="bold">小强</text>
</svg>