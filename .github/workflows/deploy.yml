name: Deploy to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run docs:build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

      - uses: actions/deploy-pages@v4

      - name: Sync to VPS
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          cd .vitepress && tar -czf /tmp/dist.tar.gz dist
          echo "Uploading to server..."
          sshpass -p ${{ secrets.SSH_PASSWORD }} scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null /tmp/dist.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/dist.tar.gz
          echo "Deploying..."
          sshpass -p ${{ secrets.SSH_PASSWORD }} ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            set -e
            mkdir -p /www/wwwroot/vitepress
            cd /www/wwwroot/vitepress
            rm -rf dist.bak
            mv dist dist.bak 2>/dev/null || true
            tar -xzf /tmp/dist.tar.gz
            chmod -R 755 dist
            chown -R www:www dist
            rm -f /tmp/dist.tar.gz
            echo done
          "
          echo "VPS sync complete"